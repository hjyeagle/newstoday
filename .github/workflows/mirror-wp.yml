name: Mirror WordPress

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-wordpress
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mirror live WordPress site
        run: bash scripts/mirror-wp.sh
        # Cafe24 allows about 4GB of traffic per day. The 2026-11-04 run was
        # stopped early so the cap would not be exceeded. The script refuses
        # to dial the host for the rest of that UTC day.

      - name: Commit and push mirror
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Refresh WordPress backup mirror"
          git push
